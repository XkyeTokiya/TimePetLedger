name: time_pet_ledger
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  drift: 2.35.0
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter

dev_dependencies:
  drift_dev: 2.35.0
  build_runner: ^2.16.1
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/activity_editor/
  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSerifSC-SemiBold.otf
          weight: 600

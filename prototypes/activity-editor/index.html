<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>Time Pet Ledger · 活动编辑原型</title><link rel="stylesheet" href="style.css"><body><aside><div class="brand">TIME PET LEDGER</div><h1>把刚才，记下来。</h1><p>活动编辑 · 可交互设计原型<br>所有业务响应均为模拟，不连接真实数据库。</p><label>状态演示<select id="scene"><option value="simple">01 最简新建 / 主路径</option><option value="goal">02 已关联目标</option><option value="stuck">03 卡住与接续点</option><option value="recovery">04 恢复</option><option value="time">05 时间弹层</option><option value="keyboard">06 时间与模拟键盘</option><option value="empty">07 目标空列表 / 创建</option><option value="conflict">08 时间冲突</option><option value="failure">09 保存失败</option><option value="none">无时间建议</option><option value="candidates">多个时间候选</option><option value="missing">更正源记录不存在</option><option value="finalize">已保存 / 等待收尾</option><option value="archived">已有归档目标引用</option><option value="draft">恢复已有草稿（优先于建议）</option></select></label><label>手机宽度<select id="width"><option>360</option><option>320</option><option>412</option></select></label><label>模拟键盘占用<select id="keyboard"><option value="0">关闭</option><option value="220">220 像素</option><option value="300">300 像素</option></select></label><label>下一次保存响应<select id="response"><option value="conflict">时间冲突（调整后成功）</option><option value="success">成功</option><option value="failure">保存失败</option><option value="finalize">成功后刷新失败</option><option value="cleanup">成功后草稿清理失败</option></select></label><label>创建目标响应<select id="goalResponse"><option value="success">成功</option><option value="failure">创建失败</option><option value="readfail">创建成功，读取失败</option></select></label><label class="check"><input id="clearFail" type="checkbox">模拟草稿清理失败</label><p class="hint">状态切换会重置当前演示。<br>主路径：填写 → 修改时间 → 创建目标 → 卡住 → 切换并返回 → 保存冲突 → 调整 → 保存。</p><a href="README.md">状态索引与设计说明</a></aside><div class="stage"><div class="caption">活动编辑 / 360 × 800</div><div id="phone"><div id="app"></div><div id="overlay"></div><div id="mockKeyboard" hidden><b>模拟键盘 · 非系统键盘</b><p>请使用电脑键盘输入</p><div>Q W E R T Y U I O P</div><div>A S D F G H J K L</div><div>Z X C V B N M</div><button onclick="setKeyboard(0)">收起模拟键盘</button></div></div></div><script src="app.js"></script></body></html>
